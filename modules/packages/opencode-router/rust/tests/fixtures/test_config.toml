[server]
host = "127.0.0.1"
port = 4001
log_level = "debug"

[classifier]
backend = "local"
model = "qwen3:8b"
timeout_seconds = 8
cache_ttl_seconds = 300

[classifier.cloud]
model = "mistral-small"
url = "http://127.0.0.1:8000/v1"

[classifier.local]
url = "http://127.0.0.1:11434"

[models.mistral-small]
description = "Fast model for trivial tasks"
family = "mistral"
provider = "litellm"
litellm_model = "mistral/mistral-small-latest"
tier = 1
fallbacks = ["mistral-medium"]

[models.mistral-medium]
description = "Strong model for complex tasks"
family = "mistral"
provider = "litellm"
litellm_model = "mistral/mistral-medium-latest"
tier = 2
fallbacks = []

[models.deepseek-v4-flash]
description = "Fast coding model"
family = "deepseek"
provider = "litellm"
litellm_model = "openai/deepseek-v4-flash"
litellm_api_base = "https://opencode.ai/zen/go/v1"
tier = 2
fallbacks = ["mistral-medium"]

[defaults]
model = "mistral-small"
global_fallbacks = ["mistral-medium"]
metadata_fallback_chain = ["mistral-small"]

[aliases]
"test-alias" = "mistral-small"

[families.mistral]
ladder = ["mistral-small", "mistral-medium"]

[prompts]
classification = """
Test classification prompt.
{models_section}
{guidance_section}
{banned_section}
{context}
"""

[prompts.guidance]
text = "Test guidance text."

[markers]
retry = ["did not work", "try again"]
retry_patterns = ["\\btry\\b.*\\bagain\\b"]
metadata = ["generate title", "session title"]
coding = ["code", "debug", "implement"]

[bans]
auth_seconds = 600
exhaustion_seconds = 900
session_quality_seconds = 600

[performance]
success_weight = 1.0
failure_weight = -2.0
reward_threshold = 5.0
decay_factor = 0.95
decay_interval_seconds = 300

[circuit_breaker]
base_cooldown_seconds = 30
max_cooldown_seconds = 300

[cache]
enabled = true
ttl_seconds = 300

[cache.pattern]
enabled = true

[cache.exact]
enabled = true

[cache.similarity]
enabled = true
threshold = 0.85
max_entries = 1000

[cache.llm]
enabled = true

[agent_instruction]
text = "Test agent instruction."

[notice]
format = "> **{display_name}**\n> {reason}"
redirect_format = "> **{original_display} → {display_name}**\n> {reason}"

[display_names]
mistral-small = "Mistral Small (Test)"
mistral-medium = "Mistral Medium (Test)"

[chatgpt]
token_url = "https://auth.openai.com/oauth/token"
client_id = "test_client_id"
responses_url = "https://chatgpt.com/backend-api/codex/responses"
account_claim_url = "https://api.openai.com/auth"
auth_file = "/tmp/test-auth.json"

[cross_family_escalation]
"mistral-small" = "mistral-medium"

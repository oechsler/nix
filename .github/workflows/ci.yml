name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run linters
        run: nix flake check --print-build-logs

  evaluate:
    name: Evaluate configurations
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate all host configurations
        run: |
          set -euo pipefail
          hosts=(samuels-terra samuels-razer samuels-ser9)
          for host in "${hosts[@]}"; do
            echo "Evaluating $host..."
            nix eval ".#nixosConfigurations.$host.config.system.build.toplevel" --show-trace
          done

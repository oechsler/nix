name: Update Flake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

jobs:
  update:
    name: Update flake.lock
    runs-on: native
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake.lock
        run: nix flake update

      - name: Check for changes
        id: check
        run: |
          set -euo pipefail
          if git diff --exit-code flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run linters
        if: steps.check.outputs.changed == 'true'
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.format \
            .#checks.x86_64-linux.lint \
            .#checks.x86_64-linux.statix \
            .#checks.x86_64-linux.shfmt \
            .#checks.x86_64-linux.deadnix \
            .#checks.x86_64-linux.shellcheck \
            .#checks.x86_64-linux.markdownlint \
            .#checks.x86_64-linux.markdown-format \
            .#checks.x86_64-linux.rust

      - name: Evaluate all host configurations
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          hosts=(samuels-terra samuels-razer samuels-ser9)
          for host in "${hosts[@]}"; do
            echo "Evaluating $host..."
            nix eval ".#nixosConfigurations.$host.config.system.build.toplevel" --show-trace
          done

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock"
          git push

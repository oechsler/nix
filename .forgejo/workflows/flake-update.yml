name: Update flake inputs

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  update:
    name: Update flake and rolling assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.FORGEJO_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake and userstyles hash
        env:
          # GitHub rate-limits anonymous flake-ref resolution aggressively.
          # Use the repository's GitHub token for flake-ref resolution.
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GH_TOKEN }}"
        run: |
          set -euo pipefail
          cache_dir=$(mktemp -d)
          trap 'rm -rf "$cache_dir"' EXIT
          export XDG_CACHE_HOME="$cache_dir"
          nix flake update
          ./scripts/update-catppuccin-userstyles-hash.sh --update

      - name: Validate update
        run: |
          set -euo pipefail
          # A fresh cache prevents stale derivation paths from a previous
          # runner invocation from being reused after the lockfile update.
          cache_dir=$(mktemp -d)
          trap 'rm -rf "$cache_dir"' EXIT
          export XDG_CACHE_HOME="$cache_dir"
          nix eval --json --option eval-cache false '.#checks.x86_64-linux' >/dev/null
          nix build --no-link --keep-going \
            .#checks.x86_64-linux.format \
            .#checks.x86_64-linux.lint \
            .#checks.x86_64-linux.statix \
            .#checks.x86_64-linux.shfmt \
            .#checks.x86_64-linux.deadnix \
            .#checks.x86_64-linux.shellcheck \
            .#checks.x86_64-linux.markdownlint \
            .#checks.x86_64-linux.markdown-format \
            .#checks.x86_64-linux.rust

      - name: Push update branch
        id: push
        env:
          BRANCH: automation/flake-update
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Forgejo Flake Updater"
          git config user.email "forgejo-flake-updater@localhost"
          git switch --create "$BRANCH"
          git add flake.lock modules/home-manager/programs/browsers.nix
          git commit -m "chore: update flake inputs and userstyles"
          git push --force origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open Forgejo pull request
        if: steps.push.outputs.changed == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          BRANCH: automation/flake-update
        run: |
          set -euo pipefail
          server="${FORGEJO_SERVER_URL:-$GITHUB_SERVER_URL}"
          repo="${FORGEJO_REPOSITORY:-$GITHUB_REPOSITORY}"
          open_pr=$(curl --fail --silent --get "$server/api/v1/repos/$repo/pulls" \
            --header "Authorization: token $FORGEJO_TOKEN" \
            --data-urlencode 'state=open' \
            --data-urlencode 'base=main' \
            --data-urlencode 'limit=50' \
            | jq -r --arg branch "$BRANCH" 'map(select(.head.ref == $branch))[0].number // empty')
          if [[ -n "$open_pr" ]]; then
            echo "Updated existing Forgejo pull request #$open_pr"
            exit 0
          fi
          curl --fail --request POST "$server/api/v1/repos/$repo/pulls" \
            --header "Authorization: token $FORGEJO_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "{\"head\":\"$BRANCH\",\"base\":\"main\",\"title\":\"chore: update flake inputs and userstyles\",\"body\":\"Automated weekly update of flake inputs and the Catppuccin rolling userstyles hash.\"}"

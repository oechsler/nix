name: Update flake inputs

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  update:
    name: Update flake and rolling assets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Update flake and userstyles hash
        env:
          # GitHub rate-limits anonymous flake-ref resolution aggressively.
          # Use the repository's GitHub token for flake-ref resolution.
          NIX_CONFIG: "access-tokens = github.com=${{ secrets.GH_TOKEN }}"
        run: |
          set -euo pipefail
          cache_dir=$(mktemp -d)
          trap 'rm -rf "$cache_dir"' EXIT
          export XDG_CACHE_HOME="$cache_dir"
          nix flake update
          ./scripts/update-catppuccin-userstyles-hash.sh --update

      - name: Validate checks
        run: |
          set -euo pipefail
          nix flake check --no-build --show-trace
          for host_dir in hosts/*; do
            [[ -f "$host_dir/configuration.nix" ]] || continue
            host=${host_dir##*/}
            echo "Evaluating $host..."
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done

      - name: Push update branch
        id: push
        env:
          BRANCH: automation/flake-update
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Nix Automation"
          git config user.email "nix-automation@oechsler.it"
          git switch --create "$BRANCH"
          git add flake.lock modules/home-manager/programs/browsers.nix
          git commit -m "chore: update flake inputs and userstyles"
          for attempt in 1 2 3; do
            if git push --force origin "$BRANCH"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              echo "Push failed after $attempt attempts" >&2
              exit 1
            fi
            sleep "$((attempt * 2))"
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.push.outputs.changed == 'true'
        env:
          FORGEJO_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          BRANCH: automation/flake-update
        run: |
          ./scripts/open-forgejo-pull-request.sh \
            "chore: update flake inputs and userstyles" \
            "Automated weekly update of flake inputs and the Catppuccin rolling userstyles hash."

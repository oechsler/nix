name: CI

on:
  push:
    branches: [main]

concurrency:
  group: nix-ci-${{ github.repository }}
  cancel-in-progress: false

jobs:
  validate:
    name: Run checks and evaluate hosts
    runs-on: native
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate all check derivations
        run: nix eval --json --option eval-cache false '.#checks.x86_64-linux' >/dev/null

      - name: Run source checks without build wrappers
        run: |
          nix shell --inputs-from . \
            nixpkgs#nixfmt \
            nixpkgs#statix \
            nixpkgs#deadnix \
            nixpkgs#shellcheck \
            nixpkgs#shfmt \
            nixpkgs#markdownlint-cli2 \
            nixpkgs#prettier \
            --command bash scripts/ci-lint.sh

      - name: Evaluate all host configurations
        run: |
          set -euo pipefail
          for host_dir in hosts/*; do
            [[ -f "$host_dir/configuration.nix" ]] || continue
            host=${host_dir##*/}
            echo "Evaluating $host..."
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done

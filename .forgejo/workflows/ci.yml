name: CI

on:
  push:
    branches: [main]

jobs:
  validate:
    name: Evaluate checks and hosts
    runs-on: native
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate all check derivations
        run: |
          nix flake check --no-build --show-trace

      - name: Evaluate all host configurations
        run: |
          set -euo pipefail
          for host_dir in hosts/*; do
            [[ -f "$host_dir/configuration.nix" ]] || continue
            host=${host_dir##*/}
            echo "Evaluating $host..."
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done

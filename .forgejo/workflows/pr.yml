name: Validate pull request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  validate:
    name: Validate merge candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout merge candidate
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Validate checks
        run: |
          set -euo pipefail
          nix build --max-jobs 2 --cores 2 --no-link --print-build-logs \
            .#checks.x86_64-linux.format \
            .#checks.x86_64-linux.lint \
            .#checks.x86_64-linux.statix \
            .#checks.x86_64-linux.shfmt \
            .#checks.x86_64-linux.deadnix \
            .#checks.x86_64-linux.shellcheck \
            .#checks.x86_64-linux.markdownlint \
            .#checks.x86_64-linux.markdown-format \
            .#checks.x86_64-linux.rust

      - name: Evaluate all host configurations
        run: |
          set -euo pipefail
          for host_dir in hosts/*; do
            [[ -f "$host_dir/configuration.nix" ]] || continue
            host=${host_dir##*/}
            echo "Evaluating $host..."
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done

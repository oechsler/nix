name: Renovate

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          GITHUB_COM_TOKEN: ${{ secrets.GH_TOKEN }}
          RENOVATE_PLATFORM: forgejo
          RENOVATE_ENDPOINT: https://git.at.oechsler.it/
          RENOVATE_REPOSITORIES: '["samuel/nix"]'
          RENOVATE_GIT_AUTHOR: Renovate Bot <renovate@git.at.oechsler.it>
          LOG_LEVEL: info
        run: npx --yes renovate
